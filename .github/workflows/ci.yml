name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Kotlin (debug + release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew compileDebugKotlin compileReleaseKotlin

      - name: Run unit tests (MessageStore)
        run: |
          cd android
          ./gradlew testDebugUnitTest

      - name: Generate test report
        if: always()
        run: scripts/run_all_tests.sh android --parse-only

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-android
          path: test-results/
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          cd ios
          brew install xcodegen
          xcodegen generate

      - name: Select simulator destination
        id: sim
        # Pick whatever iPhone simulator the runner's Xcode actually has
        # installed, rather than hardcoding a device name (e.g. "iPhone
        # 16") that may not exist on a given macos-latest image/Xcode
        # version. Falls back to "iPhone 16" if none is found.
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -E "iPhone (1[4-9]|[2-9][0-9])" | sed -E 's/^[[:space:]]*([^(]+) \(.*/\1/' | sed -E 's/[[:space:]]+$//')
          if [ -z "$NAME" ]; then
            NAME="iPhone 16"
          fi
          echo "Selected simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build for iOS Simulator
        run: |
          cd ios
          xcodebuild -scheme ThinkLessScheduleMore -sdk iphonesimulator build

      - name: Run unit tests (NotificationManager delegate wiring)
        run: |
          set -o pipefail
          mkdir -p test-results
          cd ios
          xcodebuild -scheme ThinkLessScheduleMore -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" test \
            | tee ../test-results/ios-xcodebuild.log

      - name: Generate test report
        if: always()
        run: scripts/run_all_tests.sh ios --parse-only

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ios
          path: test-results/
          if-no-files-found: warn
